services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_agent}
      POSTGRES_USER: ${POSTGRES_USER:-medical_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_nonlocal_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medical_agent} -d ${POSTGRES_DB:-medical_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      APP_ENV: ${APP_ENV:-staging}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medical_agent}:${POSTGRES_PASSWORD:-change_me_for_nonlocal_demo}@postgres:5432/${POSTGRES_DB:-medical_agent}
      ONCOTRACK_CORS_ORIGINS: ${ONCOTRACK_CORS_ORIGINS:-http://127.0.0.1:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ANSWER_MODEL: ${GROQ_ANSWER_MODEL:-openai/gpt-oss-120b}
      GROQ_ROUTER_MODEL: ${GROQ_ROUTER_MODEL:-llama-3.3-70b-versatile}
      RAG_ENABLE_CROSS_ENCODER: ${RAG_ENABLE_CROSS_ENCODER:-false}
    ports:
      - "8017:8017"
    volumes:
      - ./Data:/app/Data
      - ./KnowledgeBase:/app/KnowledgeBase
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8017/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
