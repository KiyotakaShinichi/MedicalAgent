services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_agent}
      POSTGRES_USER: ${POSTGRES_USER:-medical_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the production-shaped profile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medical_agent} -d ${POSTGRES_DB:-medical_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      APP_ENV: ${APP_ENV:-staging}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medical_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the production-shaped profile}@postgres:5432/${POSTGRES_DB:-medical_agent}
      NLCARE_CORS_ORIGINS: ${NLCARE_CORS_ORIGINS:-http://127.0.0.1:8080}
      REDIS_URL: redis://redis:6379/0
      NLCARE_OIDC_ENABLED: ${NLCARE_OIDC_ENABLED:-false}
      NLCARE_OIDC_ISSUER: ${NLCARE_OIDC_ISSUER:-}
      NLCARE_OIDC_AUDIENCE: ${NLCARE_OIDC_AUDIENCE:-}
      NLCARE_OIDC_JWKS_URL: ${NLCARE_OIDC_JWKS_URL:-}
      NLCARE_OIDC_ALGORITHMS: ${NLCARE_OIDC_ALGORITHMS:-RS256}
      NLCARE_OIDC_ROLE_CLAIM: ${NLCARE_OIDC_ROLE_CLAIM:-roles}
      NLCARE_OIDC_PATIENT_ID_CLAIM: ${NLCARE_OIDC_PATIENT_ID_CLAIM:-patient_id}
      NLCARE_OIDC_AUTHORIZATION_ENDPOINT: ${NLCARE_OIDC_AUTHORIZATION_ENDPOINT:-}
      NLCARE_OIDC_TOKEN_ENDPOINT: ${NLCARE_OIDC_TOKEN_ENDPOINT:-}
      NLCARE_OIDC_CLIENT_ID: ${NLCARE_OIDC_CLIENT_ID:-}
      NLCARE_OIDC_REDIRECT_URI: ${NLCARE_OIDC_REDIRECT_URI:-}
      NLCARE_OIDC_SCOPES: ${NLCARE_OIDC_SCOPES:-openid profile}
      NLCARE_SYNTHETIC_ONLY: "true"
      NLCARE_DATA_CLASSIFICATION: synthetic
      NLCARE_UPLOADS_ENABLED: ${NLCARE_UPLOADS_ENABLED:-false}
      NLCARE_UPLOAD_SCANNER_MODE: ${NLCARE_UPLOAD_SCANNER_MODE:-disabled}
      NLCARE_UPLOAD_SCANNER_COMMAND: ${NLCARE_UPLOAD_SCANNER_COMMAND:-}
      NLCARE_HIGH_RISK_SEMANTIC_VALIDATION_REQUIRED: "true"
      NLCARE_RAG_REQUIRE_DENSE: "true"
      NLCARE_RAG_INDEX_PATH: /app/Data/rag_index/production_dense_hybrid.joblib
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ANSWER_MODEL: ${GROQ_ANSWER_MODEL:-openai/gpt-oss-120b}
      GROQ_ROUTER_MODEL: ${GROQ_ROUTER_MODEL:-llama-3.3-70b-versatile}
      RAG_ENABLE_CROSS_ENCODER: ${RAG_ENABLE_CROSS_ENCODER:-false}
    ports:
      - "8017:8017"
    volumes:
      - ./Data:/app/Data
      - ./KnowledgeBase:/app/KnowledgeBase
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8017/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      APP_ENV: ${APP_ENV:-staging}
      ALLOW_DEMO_AUTH: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medical_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the production-shaped profile}@postgres:5432/${POSTGRES_DB:-medical_agent}
      REDIS_URL: redis://redis:6379/0
      NLCARE_CORS_ORIGINS: ${NLCARE_CORS_ORIGINS:-http://127.0.0.1:8080}
      NLCARE_OIDC_ENABLED: ${NLCARE_OIDC_ENABLED:-false}
      NLCARE_OIDC_ISSUER: ${NLCARE_OIDC_ISSUER:-}
      NLCARE_OIDC_AUDIENCE: ${NLCARE_OIDC_AUDIENCE:-}
      NLCARE_OIDC_JWKS_URL: ${NLCARE_OIDC_JWKS_URL:-}
      NLCARE_OIDC_ALGORITHMS: ${NLCARE_OIDC_ALGORITHMS:-RS256}
      NLCARE_OIDC_ROLE_CLAIM: ${NLCARE_OIDC_ROLE_CLAIM:-roles}
      NLCARE_OIDC_PATIENT_ID_CLAIM: ${NLCARE_OIDC_PATIENT_ID_CLAIM:-patient_id}
      NLCARE_OIDC_AUTHORIZATION_ENDPOINT: ${NLCARE_OIDC_AUTHORIZATION_ENDPOINT:-}
      NLCARE_OIDC_TOKEN_ENDPOINT: ${NLCARE_OIDC_TOKEN_ENDPOINT:-}
      NLCARE_OIDC_CLIENT_ID: ${NLCARE_OIDC_CLIENT_ID:-}
      NLCARE_OIDC_REDIRECT_URI: ${NLCARE_OIDC_REDIRECT_URI:-}
      NLCARE_OIDC_SCOPES: ${NLCARE_OIDC_SCOPES:-openid profile}
      NLCARE_SYNTHETIC_ONLY: "true"
      NLCARE_DATA_CLASSIFICATION: synthetic
      NLCARE_UPLOADS_ENABLED: "false"
      NLCARE_UPLOAD_SCANNER_MODE: disabled
    volumes:
      - ./Data:/app/Data
      - ./KnowledgeBase:/app/KnowledgeBase
    command: ["scripts/run_automation_worker.py", "--poll-seconds", "5", "--lease-seconds", "120"]
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
