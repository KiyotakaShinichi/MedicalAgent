[pytest]
testpaths = tests
norecursedirs = .git .venv Data frontend-react node_modules output tmp

# The default run is hermetic: no third-party credentials, no outbound network.
# `network`-marked tests are the documented exception and are deselected here
# rather than skipped ad hoc inside test bodies, so the default suite's scope is
# declared in one place and a reader can see exactly what is excluded.
markers =
    network: requires real outbound network access; excluded from the default run
addopts = -m "not network"
