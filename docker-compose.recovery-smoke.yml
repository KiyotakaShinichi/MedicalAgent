services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nlcare_smoke
      POSTGRES_USER: nlcare_smoke
      POSTGRES_PASSWORD: nlcare_recovery_smoke_only_2026
    ports:
      - "127.0.0.1:${NLCARE_RECOVERY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_smoke_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlcare_smoke -d nlcare_smoke"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:${NLCARE_RECOVERY_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_smoke_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_smoke_data:
  redis_smoke_data:
