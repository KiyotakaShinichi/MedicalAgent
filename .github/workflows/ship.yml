name: Ship Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/ship_medical_agent.db
      ENVIRONMENT: development
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/bicep \
            https://github.com/Azure/bicep/releases/download/v0.45.15/bicep-linux-x64
          echo "ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce  /tmp/bicep" \
            | sha256sum --check
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen

      # ship.py runs the safety contract test suites, which load the DEP-001
      # encoder with `local_files_only=True`. Without it in the cache those
      # runtimes fail closed and the safety steps fail for an environment
      # reason rather than a real regression. This provisions the environment;
      # it does not change any release criterion.
      - name: Cache Hugging Face encoders
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-safety-encoders-${{ hashFiles('config/dep001*_semantic_safety.yaml') }}
          restore-keys: |
            hf-safety-encoders-

      - name: Provision semantic safety encoders
        run: uv run python scripts/provision_semantic_safety_encoders.py

      # Runtime probe, not just the encoder: ship.py runs the safety contract
      # suites, and an encoder-only check passes while a runtime fails closed.
      - name: Verify safety runtimes load offline
        run: uv run python scripts/provision_semantic_safety_encoders.py --check-only --verify-runtimes

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      # `npm ci` installs @playwright/test, which contains no browsers, and this
      # project declares no postinstall hook. ship.py runs the Playwright smoke,
      # so without this the gate fails on a missing executable rather than on a
      # real regression. `--with-deps` because the runner is Ubuntu and the
      # browser needs system libraries the image does not carry.
      - name: Provision Playwright browser
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Run cross-platform ship gate
        run: uv run python scripts/ship.py

      - name: OpenAPI type drift check
        run: uv run python scripts/check_openapi_frontend_types.py
