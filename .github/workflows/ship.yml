name: Ship Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/ship_medical_agent.db
      ENVIRONMENT: development
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/bicep \
            https://github.com/Azure/bicep/releases/download/v0.45.15/bicep-linux-x64
          echo "ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce  /tmp/bicep" \
            | sha256sum --check
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run cross-platform ship gate
        run: uv run python scripts/ship.py

      - name: OpenAPI type drift check
        run: uv run python scripts/check_openapi_frontend_types.py
