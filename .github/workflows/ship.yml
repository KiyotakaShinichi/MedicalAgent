name: Ship Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/ship_medical_agent.db
      ENVIRONMENT: development
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run cross-platform ship gate
        run: python scripts/ship.py

      - name: OpenAPI type drift check
        run: python scripts/check_openapi_frontend_types.py
